# yaml-language-server: $schema=https://raw.githubusercontent.com/mihakrumpestar/panix/v0.8.1/gen/panix-schema.yaml

fleet:
  activation_mode: boot
  ssh:
    username: root
  nix:
    build_flags:
      - --keep-going
      - --max-jobs
      - "1"
      - --cores
      - "1"
    copy_flags:
      - --substitute-on-destination
  flakes:
    puntbestanden:
      configurations:
        boomer:
          machines:
            boomer:
              tags:
                - desktop
        feather:
          machines:
            feather:
              tags:
                - desktop
        commitit:
          machines:
            commitit:
              tags:
                - hetzner

flags:
  logging:
    log_file: panix.log
  snapshot:
    dir: .
  tui:
    command_output_max_lines: 1000
  # I've got ssh setup so that the keys are allowed locally, but I haven't
  # setup passwordless sudo for my desktops because that's scary
  local_machine_hostname: DONT_YOU_DARE_USE_LOCAL_SUDO_JUST_SSH_INTO_YOURSELF
