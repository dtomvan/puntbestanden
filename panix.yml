# yaml-language-server: $schema=https://raw.githubusercontent.com/mihakrumpestar/panix/v0.9.0/gen/panix-schema.yaml

fleet:
  ssh:
    username: root
  nix:
    build_flags:
      - --keep-going
      - --max-jobs
      - "1"
      - --cores
      - "1"
    copy_flags:
      - --substitute-on-destination
  flakes:
    puntbestanden:
      installables:
        nixosConfigurations:
          boomer:
            machines:
              boomer:
                tags:
                  - desktop
          feather:
            machines:
              feather:
                tags:
                  - desktop
          commitit:
            machines:
              commitit:
                ssh:
                  hostname: 91.98.231.12
                tags:
                  - hetzner

        homeConfigurations:
          "tomvd@boomer":
            user: tomvd
            machines:
              boomer:
          "tomvd@feather":
            user: tomvd
            machines:
              feather:

        packages:
          nixvim:
            user: tomvd
            machines:
              boomer:
              feather:
          flatpak-boomer:
            user: root
            preset:
              activation_path: bin/flatpak-managed-activate
            machines:
              boomer:
          flatpak-feather:
            user: root
            preset:
              activation_path: bin/flatpak-managed-activate
            machines:
              feather:
          "maid-tomvd@boomer":
            user: tomvd
            preset:
              activation_path: bin/activate
            machines:
              boomer:
          "maid-tomvd@feather":
            user: tomvd
            preset:
              activation_path: bin/activate
            machines:
              feather:

flags:
  activation_mode:
    pertype:
      nixosConfigurations: boot
      homeConfigurations: switch
  logging:
    log_file: panix.log
  snapshot:
    dir: .
  tui:
    command_output_max_lines: 1000
    command_output_max_height: 1
    show_active_only: true
  runtime:
    max_concurrency: 5
  # I've got ssh setup so that the keys are allowed locally, but I haven't
  # setup passwordless sudo for my desktops because that's scary
  local_machine_hostname: DONT_YOU_DARE_USE_LOCAL_SUDO_JUST_SSH_INTO_YOURSELF
