jobs:
  nix-flake-check:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Lockfile
        run: nix flake lock
      - name: Eval
        run: |
          declare -a packages=(nixvim nixvim-minimal)
          declare -a nixosConfigs=(boomer feather commitit)
          declare -a homeConfigs=(tomvd@boomer tomvd@feather)

          for p in "${packages[@]}"; do
            nix eval ".#packages.x86_64-linux.$p"
          done

          for p in "${nixosConfigs[@]}"; do
            nix eval ".#nixosConfigurations.$p.config.system.build.toplevel"
          done
      - name: Run selected flake checks
        run: |
          declare -a checks=(check-flake-file deploy-schema treefmt)

          for p in "${checks[@]}"; do
            nix build ".#checks.x86_64-linux.$p"
          done

"on":
  pull_request: {}
  workflow_dispatch: {}
