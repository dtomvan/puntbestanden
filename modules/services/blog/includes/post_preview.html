<article class="h-entry post">
  <time class="dt-published date" datetime="{{ post.date | date: '%F %H:%M:%S' }}"
    >{{ post.date | date: "%Y-%m-%d" }}</time
  >
  <div>
    <a class="title u-url" href="{{ post.url }}">
      {% if post.title %}
      <span class="p-name">{{post.title}}</span>
      {% elsif post.summary %}
      <span class="p-summary">{{ post.summary }}</span>
      {% else %} Note {% endif %}
    </a>
    <small>
      {% if post.favorite %} <a href="/blog/tags#⭐" style="text-decoration: none">⭐</a> {% endif
      %}
      <span class="tags hidden-mobile">
        {% for tag in post.tags %}
        <a class="p-category" href="/blog/tags#{{tag}}">#{{tag}}</a>
        {% endfor %}
      </span>
    </small>
  </div>
</article>
